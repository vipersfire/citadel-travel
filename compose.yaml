name: citadel-local

x-app: &app
  image: citadel-travel-local:dev
  build:
    context: .
    dockerfile: infra/Dockerfile
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: citadel
      POSTGRES_USER: citadel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citadel-local-only}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citadel -d citadel']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    <<: *app
    command: ['pnpm', '--filter', '@citadel/api', 'start']
    env_file: .env
    environment:
      APP_ENV: development
      APP_ORIGIN: http://localhost:3000
      PORT: 4000
      TRUST_PROXY: loopback,uniquelocal
      DATABASE_URL: postgresql://citadel:${POSTGRES_PASSWORD:-citadel-local-only}@postgres:5432/citadel
      PAYMENT_PROVIDER: development
      EMAIL_PROVIDER: development
      WHATSAPP_ENABLED: 'false'
    volumes:
      - app-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    <<: *app
    command: ['pnpm', '--filter', '@citadel/web', 'start']
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
      APP_ORIGIN: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:3000:80'
    volumes:
      - ./infra/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres:
  app-data:
